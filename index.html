<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de contacto</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .form-container {
            background: white;
            max-width: 480px;
            width: 100%;
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: normal;
            color: #333;
            margin-top: 0;
            margin-bottom: 0.3rem;
        }
        .sub {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 1.8rem;
        }
        label {
            display: block;
            font-weight: bold;
            font-size: 0.9rem;
            color: #444;
            margin-bottom: 0.3rem;
            margin-top: 1.2rem;
        }
        label:first-of-type {
            margin-top: 0;
        }
        input, textarea {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            background: #fafafa;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #0066cc;
            background: white;
        }
        textarea {
            resize: vertical;
            min-height: 90px;
        }
        button {
            margin-top: 1.8rem;
            width: 100%;
            padding: 0.7rem;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #0055aa;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Contacto</h1>
        <p class="sub">Complete el formulario y envíe su mensaje.</p>
        <form action="procesar.php" method="POST">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Su nombre" required>

            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>

            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" placeholder="Escriba su mensaje aquí..." required></textarea>

            <button type="submit">Enviar</button>
        </form>
    </div>
</body>
</html>
